# SecretReference describing the AWS credentials needed by git-remote-codecommit
# with IAM role assumption.
#
# The ci-workflow renders an ExternalSecret from this reference at build time, which
# creates a Kubernetes Secret in the workflow plane with the key names listed under
# `data[].secretKey`. The checkout-source script reads those keys to configure
# ~/.aws/credentials and ~/.aws/config before invoking `git clone codecommit://...`.
#
# The base credentials ('aws-access-key-id' and 'aws-secret-access-key') are used
# only to call sts:AssumeRole. The 'aws-role-arn' key tells checkout-source to
# create a named AWS profile that assumes the given role, which carries the actual
# CodeCommit permissions.
#
# Before applying, store these values in your central KV store (e.g., OpenBao):
#   bao kv put secret/codecommit-access-key     value="AKIA..."
#   bao kv put secret/codecommit-secret-key     value="..."
#   bao kv put secret/codecommit-region         value="us-east-1"
#   bao kv put secret/codecommit-role-arn       value="arn:aws:iam::356064724012:role/Developer"
apiVersion: openchoreo.dev/v1alpha1
kind: SecretReference
metadata:
  name: aws-codecommit-credentials
  namespace: default
spec:
  template:
    type: Opaque
  refreshInterval: 1h
  data:
    - secretKey: aws-access-key-id
      remoteRef:
        key: codecommit-access-key
        property: value
    - secretKey: aws-secret-access-key
      remoteRef:
        key: codecommit-secret-key
        property: value
    - secretKey: aws-role-arn
      remoteRef:
        key: codecommit-role-arn
        property: value
