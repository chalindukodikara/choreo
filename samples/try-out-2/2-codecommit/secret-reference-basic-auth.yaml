# SecretReference for CodeCommit HTTPS Git credentials (basic auth).
# Uses the static username/password generated in IAM > Security Credentials >
# HTTPS Git credentials for AWS CodeCommit.
apiVersion: openchoreo.dev/v1alpha1
kind: SecretReference
metadata:
  name: aws-codecommit-basic-auth
  namespace: default
spec:
  template:
    type: Opaque
  refreshInterval: 1h
  data:
    - secretKey: username
      remoteRef:
        key: codecommit-username
        property: value
    - secretKey: password
      remoteRef:
        key: codecommit-password
        property: value
