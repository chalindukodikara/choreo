# Component that builds from an AWS CodeCommit repository using git-remote-codecommit.
#
# The repository.url uses the codecommit:// scheme — git-remote-codecommit converts it
# to a signed HTTPS request using AWS credentials from the secret referenced via
# repository.secretRef. URL formats:
#   codecommit://MyDemoRepo                    # uses region from ~/.aws/config
#   codecommit::us-east-1://aws-private-repo         # explicit region (overrides config)
#   codecommit://ProfileName@MyDemoRepo        # uses a named AWS profile
apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: codecommit-greeter
  namespace: default
spec:
  owner:
    projectName: default

  componentType:
    kind: ClusterComponentType
    name: deployment/service

  autoDeploy: true

  workflow:
    kind: ClusterWorkflow
    name: dockerfile-builder
    parameters:
      repository:
        url: "codecommit::us-east-1://aws-private-repo"
        secretRef: "aws-codecommit-credentials"
        revision:
          branch: "main"
        appPath: "/service-go-greeter"
      docker:
        context: "/service-go-greeter"
        filePath: "/service-go-greeter/Dockerfile"

  parameters:
    exposed: true
    replicas: 1
    port: 8080
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "256Mi"

---
apiVersion: openchoreo.dev/v1alpha1
kind: WorkflowRun
metadata:
  name: codecommit-greeter-build-01
  namespace: default
  labels:
    openchoreo.dev/project: "default"
    openchoreo.dev/component: "codecommit-greeter"
spec:
  workflow:
    kind: ClusterWorkflow
    name: dockerfile-builder
    parameters:
      repository:
        url: "codecommit::us-east-1://aws-private-repo"
        secretRef: "aws-codecommit-credentials"
        revision:
          branch: "main"
        appPath: "/service-go-greeter"
      docker:
        context: "/service-go-greeter"
        filePath: "/service-go-greeter/Dockerfile"
