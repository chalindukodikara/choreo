# Rootless GCP Buildpacks build using CNB lifecycle creator with a local Podman daemon,
# with optional registry-based layer caching.
#
# Based on gcp-buildpacks-build.yaml (CNB rootless, no caching).
# Adds: build-cache parameter, -cache-image for registry-backed layer cache,
# -insecure-registry for HTTP in-cluster cache, fallback to local -cache-dir.
#
# Cache key: build-cache/cnb/<image-name>:cnb-cache (scoped per component).
# Build container is named "main" (log reader reads this container's logs).
#
# Output: docker-archive tarball at /mnt/vol/app-image.tar.
apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: gcp-buildpacks-build-rootless-claude
spec:
  templates:
    - name: build-image
      podSpecPatch: '{"hostUsers":false,"securityContext":{"fsGroup":1000,"fsGroupChangePolicy":"OnRootMismatch"}}'
      inputs:
        parameters:
          - name: git-revision
          - name: build-cache
            default: ""
      volumes:
        - name: storage
          emptyDir:
            sizeLimit: 10Gi
        - name: podman-run
          emptyDir: {}
        - name: cnb-layers
          emptyDir: {}
      sidecars:
        - name: podman-service
          image: quay.io/podman/stable:v5.7.1
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
          args:
            - |-
              set -e

              RUN_IMG="gcr.io/buildpacks/google-22/run@sha256:a8ccb6641b4d98b0adf6397f954e7194611d1ae61310f0561f1c00fdf7f9ba96"

              export HOME=/tmp/podman-home
              export XDG_RUNTIME_DIR=/podman-run
              mkdir -p "$HOME" "$XDG_RUNTIME_DIR"

              mkdir -p /storage/run/containers/storage /storage/.local/share/containers/storage
              cat > /tmp/storage.conf <<'STORAGEEOF'
              [storage]
              driver = "overlay"
              runroot = "/storage/run/containers/storage"
              graphroot = "/storage/.local/share/containers/storage"
              rootless_storage_path = "/storage/.local/share/containers/storage"
              [storage.options]
              pull_options = {enable_partial_images = "true", use_hard_links = "false", ostree_repos=""}
              [storage.options.overlay]
              STORAGEEOF
              export CONTAINERS_STORAGE_CONF=/tmp/storage.conf

              echo ">> Pulling CNB run image into local Podman storage: $RUN_IMG"
              podman pull "$RUN_IMG"

              exec podman system service --time=0 unix:///podman-run/podman.sock
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - mountPath: /storage
              name: storage
            - mountPath: /podman-run
              name: podman-run
      containerSet:
        volumeMounts:
          - mountPath: /mnt/vol
            name: workspace
          - mountPath: /podman-run
            name: podman-run
          - mountPath: /layers
            name: cnb-layers
        containers:
          - name: main
            image: gcr.io/buildpacks/builder@sha256:5977b4bd47d3e9ff729eefe9eb99d321d4bba7aa3b14986323133f40b622aef1
            imagePullPolicy: IfNotPresent
            command:
              - sh
              - -c
            args:
              - |-
                set -e

                WORKDIR=/mnt/vol/source
                APP_PATH="{{workflow.parameters.app-path}}"
                BUILD_ENV_JSON='{{workflow.parameters.build-env}}'
                GIT_REVISION="{{inputs.parameters.git-revision}}"
                CACHE_REGISTRY="{{inputs.parameters.build-cache}}"

                IMAGE_NAME="{{workflow.parameters.image-name}}"
                IMAGE_TAG="{{workflow.parameters.image-tag}}"
                SRC_IMAGE="${IMAGE_NAME}:${IMAGE_TAG}-${GIT_REVISION}"
                RUN_IMG="gcr.io/buildpacks/google-22/run@sha256:a8ccb6641b4d98b0adf6397f954e7194611d1ae61310f0561f1c00fdf7f9ba96"

                echo ">> [cnb-rootless] Source image: $SRC_IMAGE"
                echo ">> App path: $APP_PATH"
                echo ">> Run image: $RUN_IMG"

                if [ ! -d "$WORKDIR/$APP_PATH" ]; then
                  echo ">> Error: The specified application path '$APP_PATH' does not exist in the repository"
                  echo ">> Repository contents:"
                  ls -la "$WORKDIR/"
                  exit 1
                fi

                for i in $(seq 1 300); do
                  if [ -S /podman-run/podman.sock ]; then
                    break
                  fi
                  sleep 1
                done
                if [ ! -S /podman-run/podman.sock ]; then
                  echo ">> Error: Podman service socket was not created at /podman-run/podman.sock"
                  exit 1
                fi

                rm -f /mnt/vol/app-image.tar
                mkdir -p /mnt/vol/cnb-cache /mnt/vol/cnb-platform/env
                chmod -R a+rwX /mnt/vol/cnb-cache /mnt/vol/cnb-platform
                export HOME=/tmp/cnb-home
                mkdir -p "$HOME"
                git config --global --add safe.directory "$WORKDIR" 2>/dev/null || true
                git config --global --add safe.directory "$WORKDIR/$APP_PATH" 2>/dev/null || true
                printf '%s' '-buildvcs=false' > /mnt/vol/cnb-platform/env/GOFLAGS

                if [ -n "$BUILD_ENV_JSON" ] && [ "$BUILD_ENV_JSON" != "[]" ]; then
                  echo "$BUILD_ENV_JSON" | \
                    python3 -c "
                import json, sys
                for e in json.loads(sys.stdin.read()):
                    with open('/mnt/vol/cnb-platform/env/' + e['name'], 'w') as f:
                        f.write(e['value'])
                " 2>/dev/null || {
                    echo ">> Warning: Could not parse build env JSON, skipping build env vars"
                  }
                fi

                chmod -R a+rX "$WORKDIR/$APP_PATH" 2>/dev/null || true

                # --- Layer cache configuration ---
                CACHE_ARGS="-cache-dir=/mnt/vol/cnb-cache"
                INSECURE_ARGS=""
                if [ -n "$CACHE_REGISTRY" ] && [ "$CACHE_REGISTRY" != "none" ]; then
                  CACHE_PROBE="false"
                  if command -v wget >/dev/null 2>&1; then
                    wget -q --spider --timeout=3 "http://${CACHE_REGISTRY}/v2/" 2>/dev/null && CACHE_PROBE="true"
                  elif command -v curl >/dev/null 2>&1; then
                    curl -sf --max-time 3 -o /dev/null "http://${CACHE_REGISTRY}/v2/" 2>/dev/null && CACHE_PROBE="true"
                  else
                    echo ">> No probe tool (wget/curl), assuming cache registry available"
                    CACHE_PROBE="true"
                  fi

                  if [ "$CACHE_PROBE" = "true" ]; then
                    CACHE_IMAGE="${CACHE_REGISTRY}/build-cache/cnb/${IMAGE_NAME}:cnb-cache"
                    CACHE_ARGS="-cache-image=${CACHE_IMAGE}"
                    INSECURE_ARGS="-insecure-registry=${CACHE_REGISTRY}"
                    echo ">> CNB layer cache: ${CACHE_IMAGE}"
                  else
                    echo ">> Cache registry not reachable at ${CACHE_REGISTRY}, using local cache only"
                  fi
                fi

                echo ">> Building image with CNB lifecycle creator (local daemon export)"
                /cnb/lifecycle/creator \
                  -daemon \
                  $INSECURE_ARGS \
                  -app="$WORKDIR/$APP_PATH" \
                  -run-image="$RUN_IMG" \
                  $CACHE_ARGS \
                  -platform=/mnt/vol/cnb-platform \
                  "$SRC_IMAGE"
            env:
              - name: DOCKER_HOST
                value: unix:///podman-run/podman.sock
              - name: CNB_PLATFORM_API
                value: "0.14"
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
          - name: save-image
            dependencies:
              - main
            image: quay.io/podman/stable:v5.7.1
            imagePullPolicy: IfNotPresent
            command:
              - sh
              - -c
            args:
              - |-
                set -e

                IMAGE_NAME="{{workflow.parameters.image-name}}"
                IMAGE_TAG="{{workflow.parameters.image-tag}}"
                GIT_REVISION="{{inputs.parameters.git-revision}}"
                SRC_IMAGE="${IMAGE_NAME}:${IMAGE_TAG}-${GIT_REVISION}"

                echo ">> Saving CNB image as docker-archive tarball"
                podman --remote --url unix:///podman-run/podman.sock save -o /mnt/vol/app-image.tar "$SRC_IMAGE"
                chmod a+r /mnt/vol/app-image.tar
                echo ">> Image built successfully: /mnt/vol/app-image.tar"
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
