# PushSecret: Push K8s Secret to HashiCorp Vault
# Flow: K8s Secret "github-credentials-source" -> Vault path "github-credentials"
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: test-01-secret
  namespace: openchoreo-test
spec:
  refreshInterval: 1m
  updatePolicy: Replace              # Replace | IfNotExists
  deletionPolicy: Delete             # Delete Vault secret when PushSecret is deleted
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: openbao
  selector:
    secret:
      name: test-01-github-credentials    # Source K8s secret to push FROM
  data:
    - match:
        secretKey: password              # Key in the K8s secret to push
        remoteRef:
          remoteKey: test-01-github-credentials  # Vault path (becomes secret/data/github-credentials in KV v2)
          property: password             # Store with same property name as source
