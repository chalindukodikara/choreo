# PushSecret: Push K8s Secret to HashiCorp Vault
# Flow: K8s Secret "github-credentials-source" -> Vault path "github-credentials"
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: github-credentials-push-01
  namespace: default
spec:
  refreshInterval: 1m
  updatePolicy: Replace              # Replace | IfNotExists
  deletionPolicy: Delete             # Delete Vault secret when PushSecret is deleted
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: openbao
  selector:
    secret:
      name: github-credentials-source-01    # Source K8s secret to push FROM
  data:
    - match:
        secretKey: password              # Key in the K8s secret to push
        remoteRef:
          remoteKey: github-credentials  # Vault path (becomes secret/data/github-credentials in KV v2)
          property: password             # Store with same property name as source
    - match:
        secretKey: username              # Key in the K8s secret to push
        remoteRef:
          remoteKey: username-github-credentials  # Vault path (becomes secret/data/github-credentials in KV v2)
          property: username             # Store with same property name as source
