# ExternalSecret: Sync from Vault back to K8s Secret
# Flow: Vault path "github-credentials" -> K8s Secret "github-credentials-synced"
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-credentials-sync-02
  namespace: default
spec:
  refreshInterval: 45s
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: github-credentials-synced-02      # Name of the K8s secret to CREATE
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth     # Match source secret type
  data:
    - secretKey: password                # Same key name as source secret
      remoteRef:
        key: github-credentials          # Vault path (must match PushSecret's remoteKey)
        property: password               # Property in Vault (must match PushSecret's property)
    - secretKey: ""                # Same key name as source secret
      remoteRef:
        key: ""  # Vault path (must match PushSecret's remoteKey)
        property: ""               # Property in Vault (must match PushSecret's property)