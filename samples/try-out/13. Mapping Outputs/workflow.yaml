apiVersion: openchoreo.dev/v1alpha1
kind: Workflow
metadata:
  annotations:
    openchoreo.dev/component-workflow-parameters: |
      repoUrl: parameters.repository.url
      branch: parameters.repository.revision.branch
      commit: parameters.repository.revision.commit
      appPath: parameters.repository.appPath
    openchoreo.dev/workflow-scope: component
  name: docker
  namespace: default
spec:
  buildPlaneRef:
    kind: BuildPlane
    name: default
  externalRefs:
    - apiVersion: openchoreo.dev/v1alpha1
      id: git-secret-reference
      kind: SecretReference
      name: ${parameters.repository.secretRef}
  resources:
    - id: git-secret
      includeWhen: ${has(parameters.repository.secretRef) && parameters.repository.secretRef
        != ""}
      template:
        apiVersion: external-secrets.io/v1
        kind: ExternalSecret
        metadata:
          name: ${metadata.workflowRunName}-git-secret
          namespace: ${metadata.namespace}
        spec:
          data: |
            ${externalRefs['git-secret-reference'].spec.data.map(secret, {
              "secretKey": secret.secretKey,
              "remoteRef": {
                "key": secret.remoteRef.key,
                "property": has(secret.remoteRef.property) && secret.remoteRef.property != "" ? secret.remoteRef.property : oc_omit()
              }
            })}
          refreshInterval: 15s
          secretStoreRef:
            kind: ClusterSecretStore
            name: default
          target:
            creationPolicy: Owner
            name: ${metadata.workflowRunName}-git-secret
            template:
              type: ${externalRefs['git-secret-reference'].spec.template.type}
    - id: registry-push-secret
      template:
        apiVersion: external-secrets.io/v1
        kind: ExternalSecret
        metadata:
          name: ${metadata.workflowRunName}-registry-push-secret
          namespace: ${metadata.namespace}
        spec:
          data:
            - remoteRef:
                key: registry-push-secret
              secretKey: registrysecret
          refreshInterval: 15s
          secretStoreRef:
            kind: ClusterSecretStore
            name: default
          target:
            creationPolicy: Owner
            name: ${metadata.workflowRunName}-registry-push-secret
            template:
              data:
                .dockerconfigjson: '{{ .registrysecret | toString }}'
              type: kubernetes.io/dockerconfigjson
  runTemplate:
    apiVersion: argoproj.io/v1alpha1
    kind: Workflow
    metadata:
      name: ${metadata.workflowRunName}
      namespace: ${metadata.namespace}
    spec:
      arguments:
        parameters:
          - name: component-name
            value: ${metadata.labels['openchoreo.dev/component']}
          - name: project-name
            value: ${metadata.labels['openchoreo.dev/project']}
          - name: git-repo
            value: ${parameters.repository.url}
          - name: branch
            value: ${parameters.repository.revision.branch}
          - name: commit
            value: ${parameters.repository.revision.commit}
          - name: app-path
            value: ${parameters.repository.appPath}
          - name: docker-context
            value: ${parameters.docker.context}
          - name: dockerfile-path
            value: ${parameters.docker.filePath}
          - name: image-name
            value: ${metadata.namespaceName}-${metadata.labels['openchoreo.dev/project']}-${metadata.labels['openchoreo.dev/component']}
          - name: image-tag
            value: v1
          - name: git-secret
            value: ${metadata.workflowRunName}-git-secret
          - name: registry-push-secret
            value: ${metadata.workflowRunName}-registry-push-secret
      entrypoint: build-workflow
      serviceAccountName: workflow-sa
      templates:
        - name: build-workflow
          steps:
            - - name: checkout-source
                templateRef:
                  clusterScope: true
                  name: checkout-source
                  template: checkout
            - - arguments:
                  parameters:
                    - name: git-revision
                      value: '{{steps.checkout-source.outputs.parameters.git-revision}}'
                name: build-image
                templateRef:
                  clusterScope: true
                  name: docker
                  template: build-image
            - - arguments:
                  parameters:
                    - name: git-revision
                      value: '{{steps.checkout-source.outputs.parameters.git-revision}}'
                name: publish-image
                templateRef:
                  clusterScope: true
                  name: publish-image
                  template: publish-image
            - - arguments:
                  parameters:
                    - name: image
                      value: '{{steps.publish-image.outputs.parameters.image}}'
                name: generate-workload-cr
                templateRef:
                  clusterScope: true
                  name: generate-workload
                  template: generate-workload-cr
      volumeClaimTemplates:
        - metadata:
            name: workspace
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 2Gi
  schema:
    parameters:
      docker:
        context: string | default=. description="Docker build context path relative
          to the repository root"
        filePath: string | default=./Dockerfile description="Path to the Dockerfile
          relative to the repository root"
      repository:
        appPath: string | default=. description="Path to the application directory
          within the repository"
        revision:
          branch: string | default=main description="Git branch to checkout"
          commit: string | default="" description="Git commit SHA or reference (optional,
            defaults to latest)"
        secretRef: string | default="" description="Secret reference name for Git
          credentials"
        url: string | description="Git repository URL"
  ttlAfterCompletion: 1d