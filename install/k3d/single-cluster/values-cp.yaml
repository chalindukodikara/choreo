# Helm values for OpenChoreo Control Plane in k3d single-cluster setup
# This file contains overrides specific to running the control plane in a k3d environment

openchoreoApi:
  ingress:
    enabled: true
    hosts:
      - host: api.openchoreo.localhost
        paths:
          - path: /
            pathType: Prefix

backstage:
  ingress:
    enabled: true
    hosts:
      - host: openchoreo.localhost
        paths:
          - path: /
            pathType: Prefix
  baseUrl: http://openchoreo.localhost:8080
  auth:
    authorizationUrl: http://thunder.openchoreo.localhost:8080/oauth2/authorize

asgardeoThunder:
  config:
    gateClient:
      hostname: "thunder.openchoreo.localhost"
      port: 8080
  runtimeConfig:
    server:
      hostname: "thunder.openchoreo.localhost"
      port: 8080
  backstagePortal:
    enabled: true
    redirectUrls:
      - "http://localhost:7007/api/auth/default-idp/handler/frame"
      - "http://openchoreo.localhost:8080/api/auth/default-idp/handler/frame"
  ingress:
    enabled: true
    hosts:
      - host: thunder.openchoreo.localhost
        paths:
          - path: /
            pathType: Prefix
            port: 8090
